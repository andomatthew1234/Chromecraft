version: 2

updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "20:00"
      timezone: Australia/Sydney
    open-pull-requests-limit: 10
    versioning-strategy: increase
    groups:
      electron-runtime:
        patterns:
          - electron
          - "@electron/*"
          - "@electron-forge/*"
        update-types:
          - minor
          - patch
      production-dependencies:
        dependency-type: production
        exclude-patterns:
          - electron
          - "@electron/*"
          - "@electron-forge/*"
        update-types:
          - minor
          - patch
      development-dependencies:
        dependency-type: development
        exclude-patterns:
          - electron
          - "@electron/*"
          - "@electron-forge/*"
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "21:00"
      timezone: Australia/Sydney
    open-pull-requests-limit: 5
    groups:
      actions-minor-and-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
